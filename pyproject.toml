[project]
name = "comfyui-stillfront"
description = "Custom nodes for ComfyUI including LLM Chat with support for Claude 4.5, Gemini 3, and OpenAI GPT-5 models, plus utility nodes for enhanced workflows"
version = "1.0.1"
license = { file = "LICENSE" }
dependencies = [
    "requests>=2.31.0",
    "pillow>=10.0.0",
    "numpy<2.0.0",
    "torch",
    "pydantic>=2.0.0",
    "google-genai>=1.0.0",
    "google-cloud-storage>=2.0.0"
]

[project.urls]
Repository = "https://github.com/razvanmatei-sf/comfyui-stillfront"

[tool.comfy]
PublisherId = "stillfront"
DisplayName = "Stillfront Custom Nodes"
Icon = ""
